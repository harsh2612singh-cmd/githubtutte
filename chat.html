<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE AI Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:#050816;
overflow:hidden;
color:white;
}

/* Animated Background */

body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#00aaff;
border-radius:50%;
filter:blur(150px);
left:-100px;
top:-100px;
animation:move1 8s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#7b2cff;
border-radius:50%;
filter:blur(150px);
right:-100px;
bottom:-100px;
animation:move2 8s infinite alternate;
}

@keyframes move1{
from{transform:translateY(0);}
to{transform:translateY(100px);}
}

@keyframes move2{
from{transform:translateY(0);}
to{transform:translateY(-100px);}
}

.container{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
}

/* Header */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.menu,
.profile{
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
cursor:pointer;
}

.logo{
font-size:28px;
font-weight:bold;
}

/* Chat Area */

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.bot{
align-self:flex-start;
background:rgba(255,255,255,.08);
padding:15px;
border-radius:20px;
max-width:70%;
animation:fadeIn .4s;
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#00c6ff,#7b2cff);
padding:15px;
border-radius:20px;
max-width:70%;
animation:fadeIn .4s;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Typing */

.typing{
align-self:flex-start;
background:rgba(255,255,255,.08);
padding:15px;
border-radius:20px;
}

.dot{
display:inline-block;
width:8px;
height:8px;
border-radius:50%;
background:white;
margin:3px;
animation:bounce 1s infinite;
}

.dot:nth-child(2){
animation-delay:.2s;
}

.dot:nth-child(3){
animation-delay:.4s;
}

@keyframes bounce{
50%{
transform:translateY(-5px);
}
}

/* Bottom Input */

.bottom{
padding:15px;
}

.input-box{
display:flex;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:50px;
padding:10px;
}

.input-box input{
flex:1;
background:none;
border:none;
outline:none;
color:white;
font-size:18px;
padding:10px;
}

.send{
width:55px;
height:55px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00c6ff,#7b2cff);
color:white;
font-size:20px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="menu">☰</div>

<div class="logo">🤖 ONE AI</div>

<div class="profile" onclick="logout()">⚙️</div>

</div>

<div class="chat-box" id="chatBox">

<div class="bot" id="welcomeMsg">

</div>

</div>

<div class="bottom">

<div class="input-box">

<input
type="text"
id="message"
placeholder="Ask ONE AI...">

<button
class="send"
onclick="sendMessage()">
➤
</button>

</div>

</div>

</div>


<script>
    let user =
localStorage.getItem("username");

document.getElementById("welcomeMsg").innerHTML =
"Hello " + user + " 👋<br>Welcome to ONE AI.<br>How can I help you today?";

const chatBox =
document.getElementById("chatBox");

function sendMessage(){

let input =
document.getElementById("message");

let text =
input.value.trim();

if(text === ""){
return;
}

/* User Message */

chatBox.innerHTML +=
`
<div class="user">
${text}
</div>
`;

/* Clear Input */

input.value = "";

/* Auto Scroll */

chatBox.scrollTop =
chatBox.scrollHeight;

/* Typing Animation */

chatBox.innerHTML +=
`
<div class="typing" id="typing">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>
`;

chatBox.scrollTop =
chatBox.scrollHeight;

/* Fake AI Reply */

setTimeout(() => {

document
.getElementById("typing")
.remove();

let reply =
getAIReply(text);

chatBox.innerHTML +=
`
<div class="bot">
${reply}
</div>
`;

chatBox.scrollTop =
chatBox.scrollHeight;

saveChat();

},1500);

saveChat();

}

/* AI Responses */

function getAIReply(message){

message =
message.toLowerCase();

if(message.includes("hello") ||
message.includes("hi")){

return "👋 Hello! I am ONE AI. How can I help you today?";

}

if(message.includes("your name")){

return "🤖 My name is ONE AI, your futuristic assistant.";

}

if(message.includes("who are you")){

return "🚀 I am ONE AI. Built to assist, answer and chat with you.";

}

if(message.includes("how are you")){

return "😊 I'm doing great! Thanks for asking.";

}

if(message.includes("bye")){

return "👋 Goodbye! Have a wonderful day.";

}

return "✨ That's interesting. Tell me more about it.";

}

/* Enter Key */

document
.getElementById("message")
.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){

sendMessage();

}

}
);

/* Save Chat */

function saveChat(){

localStorage.setItem(
"chatHistory",
chatBox.innerHTML
);

}

/* Load Chat */

window.onload = function(){

let history =
localStorage.getItem(
"chatHistory"
);

if(history){

chatBox.innerHTML =
history;

}

function logout(){

window.location.href = "index.html";

}

};

</script>

</body>
</html>
