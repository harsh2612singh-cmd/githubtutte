
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#181A20;
color:white;
min-height:100vh;
padding:30px;
}

.back{
font-size:35px;
cursor:pointer;
margin-bottom:40px;
}

h1{
font-size:50px;
margin-bottom:15px;
}

.desc{
font-size:22px;
line-height:1.5;
color:#b0b0b0;
margin-bottom:40px;
}

input{
width:100%;
padding:22px;
font-size:22px;
background:#1f222b;
border:1px solid #444;
border-radius:22px;
color:white;
outline:none;
margin-bottom:25px;
}

.remember{
display:flex;
align-items:center;
font-size:22px;
margin-bottom:30px;
}

.remember input{
width:25px;
height:25px;
margin-right:15px;
}

.learn{
color:#2196f3;
text-decoration:none;
margin-left:5px;
}

button{
width:100%;
padding:22px;
border:none;
border-radius:40px;
background:#1877f2;
color:white;
font-size:25px;
cursor:pointer;
}

.bottom{
position:fixed;
bottom:30px;
left:0;
right:0;
text-align:center;
}

.bottom a{
color:#2196f3;
font-size:24px;
text-decoration:none;
}

</style>
</head>

<body>

<div class="back" onclick="history.back()">←</div>

<h1>Create a password</h1>

<p class="desc">
Create a password with at least six letters or numbers.
It should be something that others can't guess.
</p>
<input
type="text"
id="newUsername"
placeholder="Username">

<input
type="password"
id="newPassword"
placeholder="Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<div class="remember">

<input
type="checkbox"
checked>

<span>
Remember login info.
</span>

<a href="#" class="learn">
Learn more
</a>

</div>

<button onclick="createAccount()">
Create Account
</button>

<div class="bottom">

<a href="index.html">
I already have an account
</a>

</div>

<script>

function createAccount(){

let user =
document.getElementById("newUsername").value;

let pass =
document.getElementById("newPassword").value;

let confirm =
document.getElementById("confirmPassword").value;

if(user === ""){

alert("Please enter username");

return;

}

if(pass.length < 6){

alert("Password must be at least 6 characters");

return;

}

if(pass !== confirm){

alert("Passwords do not match");

return;

}

localStorage.setItem("username", user);

localStorage.setItem("password", pass);

alert("Saved Username: " + user);

alert("Saved Password: " + pass);

alert("Account Created Successfully");

window.location.href = "index.html";
}

</script>
</body>
</html>
