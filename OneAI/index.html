
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center; 
align-items:center;
background:#050816;
overflow:hidden;
}

/* Animated Background */
body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#00aaff;
border-radius:50%;
left:10%;
top:20%;
filter:blur(130px);
animation:move1 10s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:#7b2cff;
border-radius:50%;
right:10%;
bottom:10%;
filter:blur(130px);
animation:move2 10s infinite alternate;
}

@keyframes move1{
from{transform:translateY(0);}
to{transform:translateY(-100px);}
}

@keyframes move2{
from{transform:translateY(0);}
to{transform:translateY(100px);}
}

/* Splash Screen */
#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#splash h1{
font-size:80px;
color:#00c6ff;
text-shadow:
0 0 20px #00c6ff,
0 0 40px #00c6ff,
0 0 60px #00c6ff;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.2;}
100%{opacity:1;}
}

/* Login Card */
.container{
display:none;
width:400px;
padding:35px;
border-radius:35px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 30px rgba(0,170,255,.3);
text-align:center;
z-index:2;
}

.language{
text-align:right;
margin-bottom:10px;
}

.language select{
background:transparent;
color:white;
border:none;
outline:none;
font-size:16px;
}

.robot{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#00c6ff,#0072ff);
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
box-shadow:0 0 25px #00c6ff;
}

.logo h1{
margin-top:20px;
font-size:42px;
color:white;
}

.subtitle{
color:#ccc;
margin-top:10px;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
background:rgba(255,255,255,.1);
border:none;
border-radius:15px;
outline:none;
font-size:16px;
color:white;
}

input::placeholder{
color:#ccc;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#00c6ff,#7b2cff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #00aaff;
}

.links{
margin-top:20px;
}

.links a{
display:block;
margin:10px;
color:white;
text-decoration:none;
}

.links a:hover{
color:#00c6ff;
}

.footer{
margin-top:30px;
color:#aaa;
font-size:13px;
}
</style>
</head>

<body>

<div id="splash">
<h1>ONE AI</h1>
</div>

<div class="container" id ="mainPage">

<div class="language">
<select id="language">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
</select>
</div>

<div class="logo">
<div class="robot">🤖</div>
<h1>ONE AI</h1>
<p class="subtitle">Future Of Intelligence</p>
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn" onclick="loginUser()">Login</button>

<div class="links">
<a href="#" id="forgot">Forgot Password?</a>
<a href="register.html" id="create">Create Account</a>
</div>

<div class="footer">
ONE AI © 2026
</div>

</div>

<script>

    function loginUser(){

let enteredUser =
document.getElementById("username").value;

let enteredPass =
document.getElementById("password").value;

let savedUser =
localStorage.getItem("username");

let savedPass =
localStorage.getItem("password");
alert("Saved User: " + savedUser);
alert("Saved Pass: " + savedPass);

if(
enteredUser === savedUser &&
enteredPass === savedPass
){

alert("Login Successful");

window.location.href = "chat.html";

}
else{

alert("Incorrect Username or Password");

}

    }

window.addEventListener("load", function(){

setTimeout(function(){

document.getElementById("splash").style.display = "none";

document.querySelector(".container").style.display = "block";

}, 5000);

});

document.getElementById("language").addEventListener("change", function(){

if(this.value === "hi"){

document.getElementById("username").placeholder = "यूज़रनेम";
document.getElementById("password").placeholder = "पासवर्ड";
document.getElementById("loginBtn").innerText = "लॉगिन";
document.getElementById("forgot").innerText = "पासवर्ड भूल गए?";
document.getElementById("create").innerText = "अकाउंट बनाएं";
document.querySelector(".subtitle").innerText = "भविष्य की बुद्धिमत्ता";

}else{

document.getElementById("username").placeholder = "Username";
document.getElementById("password").placeholder = "Password";
document.getElementById("loginBtn").innerText = "Login";
document.getElementById("forgot").innerText = "Forgot Password?";
document.getElementById("create").innerText = "Create Account";
document.querySelector(".subtitle").innerText = "Future Of Intelligence";

}

});

</script>
</body>
</html>
