

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#000428,#004e92);
}

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

#splash h1{
font-size:60px;
color:white;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

.mobile-frame{
display:none;
width:390px;
height:780px;
background:white;
border-radius:40px;
padding:30px;
box-shadow:0 0 25px rgba(0,0,0,.3);
}

.logo{
text-align:center;
margin-top:30px;
}

.logo-circle{
width:90px;
height:90px;
background:#004e92;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:32px;
font-weight:bold;
}

.logo h1{
margin-top:15px;
color:#004e92;
}

.language{
text-align:right;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
background:#f2f2f2;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:#004e92;
color:white;
font-size:16px;
cursor:pointer;
}

.links{
text-align:center;
margin-top:15px;
}

.links a{
display:block;
margin:8px;
text-decoration:none;
color:#004e92;
}
</style>
</head>

<body>

<div id="splash">
<h1>ONE AI</h1>
</div>

<div class="mobile-frame" id="app">

<div class="language">
<select id="language">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
</select>
</div>

<div class="logo">
<div class="logo-circle">AI</div>
<h1>ONE AI</h1>
</div>

<br><br>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn" onclick="login()">
Login
</button>

<div class="links">
<a href="#">Forgot Password?</a>
<a href="#">Create Account</a>
</div>

</div>

<script>

setTimeout(function(){
document.getElementById("splash").style.display="none";
document.getElementById("app").style.display="block";
},5000);

function login(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

if(username=="" || password==""){
alert("Please fill all fields");
return;
}

localStorage.setItem("lastUser",username);

alert("Login Successful");

}

document.getElementById("language")
.addEventListener("change",function(){

if(this.value==="hi"){

document.getElementById("username").placeholder="यूज़रनेम";
document.getElementById("password").placeholder="पासवर्ड";
document.getElementById("loginBtn").innerText="लॉगिन";

}else{

document.getElementById("username").placeholder="Username";
document.getElementById("password").placeholder="Password";
document.getElementById("loginBtn").innerText="Login";

}

});

</script>

</body>
</html>
